name: Wetter für alle Seen

# EINE Pipeline für ALLE fünf Seen von BinnenSkipper.
#
# ⚠️ WARUM DIESES EIGENE, ÖFFENTLICHE PROJEKT?
#
# Vorher liefen drei getrennte Abläufe in zwei PRIVATEN Projekten
# (ChiemseeSailing: Chiemsee; StarnbergSailing: Starnberg + Ammersee), jeder alle
# drei Stunden. Private Projekte haben im kostenlosen GitHub-Tarif 2.000
# Actions-Minuten pro Monat. Drei Abläufe × 8 Läufe am Tag × ~30 Tage haben das
# im Juli 2026 aufgebraucht — danach schlugen ALLE Wetterläufe fehl.
#
# Öffentliche Projekte haben dagegen unbegrenzte, kostenlose Minuten auf den
# Standard-Runnern (GitHub-Doku: "GitHub Actions usage is free … for public
# repositories that use standard GitHub-hosted runners"). Deshalb liegt hier NUR
# die Wetter-Pipeline — kein App-Quelltext. Die SFTP-Zugangsdaten stehen in den
# Repository-Secrets und sind auch in einem öffentlichen Projekt nicht sichtbar.
#
# ⚠️ EIN AUFTRAG JE SEE, NICHT ALLE FÜNF NACHEINANDER.
#
# Der erste Entwurf baute alle fünf Seen in einer Schleife, um die Einrichtung
# (ecCodes + Python, gut zwei Minuten) nur einmal zu bezahlen. Sparsam gedacht,
# aber falsch: In einem ÖFFENTLICHEN Projekt sind die Minuten kostenlos — es
# zählt allein die Uhrzeit. Nacheinander brauchten die fünf Seen zusammen
# 31 Minuten und liefen ins 30-Minuten-Limit (2026-07-28).
#
# Nebeneinander läuft jeder See in seinem eigenen Auftrag: rund sieben Minuten
# statt einunddreißig, und ein hängender See blockiert die anderen nicht mehr.
#
# ⚠️ Die STURMWARNLEUCHTEN baut dieser Ablauf bewusst NICHT.
# Das macht der 5-Minuten-Cron auf huggie.de (chiemsee-skipper/stormlight.php)
# für alle Seen — häufiger, ohne Actions-Minuten und unabhängig davon, ob GitHub
# gerade läuft. Zwei Schreiber auf dieselbe Datei wären nur ein Wettlauf.

on:
  schedule:
    # Alle drei Stunden, um :40. Die App verwirft Modelldaten, die älter als
    # 12 Stunden sind, und fällt dann auf DWD/Bright Sky zurück — drei Stunden
    # lassen also reichlich Luft, auch wenn ein Lauf einmal ausfällt.
    - cron: "40 1-23/3 * * *"
  workflow_dispatch:

concurrency:
  group: wetter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wetter:
    name: ${{ matrix.see }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # ⚠️ fail-fast aus: Ein See, für den der DWD seinen Modelllauf noch nicht
      # fertig veröffentlicht hat, darf die anderen vier nicht mit abbrechen.
      fail-fast: false
      matrix:
        include:
          # ⚠️ Koordinaten EXAKT aus src/config/lakes/<see>.ts (LAKE.weather.point).
          # Weicht hier etwas ab, zeigt das Wetter-Widget einen anderen Punkt als
          # die Wetterseite der App.
          #
          # ⚠️ "ziel" ist RELATIV zum Startverzeichnis des SFTP-Zugangs. Der
          # startet in /huggie/binnenskipper, deshalb "wetter/<see>" und nicht
          # "binnenskipper/wetter/<see>". Wer den Zugang wechselt, muss das hier
          # mitziehen — sonst entsteht ein verschachtelter Ordner und der Lauf
          # bleibt trotzdem grün. Dagegen prüft der letzte Schritt gegen.
          - see: chiemsee
            lat: "47.88"
            lon: "12.45"
            ziel: wetter/chiemsee
          - see: starnberg
            lat: "47.909"
            lon: "11.311"
            ziel: wetter/starnberg
          - see: ammersee
            lat: "48.006"
            lon: "11.125"
            ziel: wetter/ammersee
          - see: tegernsee
            lat: "47.72"
            lon: "11.745"
            ziel: wetter/tegernsee
          - see: brombachsee
            lat: "49.132"
            lon: "10.9272"
            ziel: wetter/brombachsee

    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      - name: ecCodes installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes0 libeccodes-dev

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/weather/requirements.txt

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/weather/requirements.txt

      - name: Vorhersage bauen
        env:
          LAKE_LAT: ${{ matrix.lat }}
          LAKE_LON: ${{ matrix.lon }}
          WEATHER_OUT_DIR: dist
        run: python pipeline/weather/build_weather.py

      - name: Auf den Webspace laden
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          WEATHER_OUT_DIR: dist
          FTP_REMOTE_DIR: ${{ matrix.ziel }}
        run: python pipeline/weather/upload_sftp.py

      # ⚠️ Ohne diesen Schritt kann der Ablauf grün werden, während die Dateien
      # an der falschen Stelle liegen. Warum das dreimal passiert ist, steht in
      # pipeline/weather/pruefe_veroeffentlicht.py.
      #
      # ⚠️ BEIDE Modelle prüfen. Bis zum 2026-07-28 stand hier nur icon-d2 — und
      # weil ein einzeln fehlgeschlagenes Modell den Lauf absichtlich nicht rot
      # macht, konnte icon-eu monatelang unbemerkt veralten. In der App war das
      # nicht als Fehler zu erkennen: Sie fällt still auf Bright Sky zurück.
      - name: Gegenprobe über die öffentlichen Adressen
        run: |
          python pipeline/weather/pruefe_veroeffentlicht.py \
            "https://www.huggie.de/binnenskipper/${{ matrix.ziel }}/icon-d2.json" \
            "https://www.huggie.de/binnenskipper/${{ matrix.ziel }}/icon-eu.json"
